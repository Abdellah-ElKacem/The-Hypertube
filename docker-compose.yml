version: '3.8'

services:

  backend:
    build: ./backend
    container_name: hypertube_backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: hybertube-frontend
    ports:
      - "3001:3001"
    env_file:
      - ./frontend/.env